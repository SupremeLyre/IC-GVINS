# IC-GVINS configuration migrated from LE-VINS le_vins_gopro_20260525.yaml

# Output directory
outputpath: /mnt/nvme1/datasets/20260525/IC-GVINS/
is_make_outputdir: true

# ROS interface configuration
ros:
    imu_topic: "/gopro/imu"
    # LE-VINS did not use GNSS in this config; keep this as the GNSS topic used by IC-GVINS.
    gnss_topic: "/gopro/gps"
    image_topic: "/gopro/image_raw/compressed"
    use_compressed_image: true
    # These bag fields are kept for traceability; IC-GVINS ROS currently subscribes live topics.
    is_read_bag: true
    bag_file: "/mnt/nvme1/datasets/20260525/campus01.bag2"

# Time length for GNSS/INS initialization, s
initlength: 1

# IMU sample rate, Hz
imudatarate: 200

# IMU raw frame orientation, converted internally to FRD
imu_orientation: "LBU"

# Additional IMU options migrated from LE-VINS imu.*
imu:
    is_use_zupt: true

# Consider the Earth rotation
iswithearth: true

# GNSS lever-arm in IMU body frame (front-right-down), m
# TODO: replace with the calibrated GoPro-IMU to GNSS antenna lever arm.
antlever: [0.0, 0.0, 0.0]

# IMU noise parameters migrated from le_vins_gopro_20260525.yaml: imu.*
imumodel:
    arw: 0.4        # deg/sqrt(hr)
    vrw: 0.15       # m/s/sqrt(hr)
    gbstd: 10.0     # deg/hr
    abstd: 1000.0   # mGal
    corrtime: 1.0   # hr

# GNSS outage configurations
isusegnssoutage: false
gnssoutagetime: 0

# A fixed threshold (STD, m) for GNSS outlier culling
gnssthreshold: 20

# Use visualization
is_use_visualization: true

# Tracking configurations migrated from visual.*
track_check_histogram: false
track_min_parallax: 10
track_max_interval: 0.5
track_max_features: 250

# Optimization configurations migrated from optimizer.*
reprojection_error_std: 3.0
optimize_windows_size: 10
optimize_num_iterations: 20
optimize_estimate_extrinsic: true
optimize_estimate_td: true
# Same semantics as LE-VINS: true applies a tighter camera-IMU extrinsic prior.
optimize_cam_extrinsic_accurate: false

# Camera parameters migrated from visual.*
cam0:
    camera_model: pinhole
    mask_file: ""

    # Intrinsic parameters [fx, fy, cx, cy(, skew)]
    intrinsic: [451.34073023825806, 451.9064183809128, 479.78019808966025, 257.82734789876633]

    # Distortion parameters [k1, k2, p1, p2(, k3)]
    distortion: [-3.4259447448837164e-09, 1.1282867918122256e-18, -0.0026242864498785714,
        0.00195194317000109, -2.649890195959425e-28]

    # Resolution
    resolution: [960, 540]

    # Camera-IMU extrinsic: Pb = q_b_c * Pc + t_b_c
    # This calibration is in the raw LBU IMU frame and will be converted to FRD.
    extrinsic_in_raw_imu_frame: true

    # q (x, y, z, w)
    q_b_c: [0.002416585476968828, -0.7052862821400451, 0.7089157927543835, 0.001954257692674749]
    t_b_c: [0.020190683663038146, -0.053204329932253984, -0.0037557191496503262]

    # t_i = t_c + td
    td_b_c: 0.0
